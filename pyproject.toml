[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "egsearch"
version = "0.1.0"
description = "Local multimodal search with Google EmbeddingGemma 2."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "sentence-transformers[image]>=6.1.0",
  "torchvision",
  "transformers>=5.18,<6",
]

[project.scripts]
egsearch = "egsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
